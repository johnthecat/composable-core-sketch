[package]
name = "sketch-wallet-mock"
version = "0.1.0"
description = "Wallet provider that simulates a wallet on a paired phone, held in memory"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt cannot read the enabled Wasm features from a stripped binary, so they
# are listed here.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
    "--strip-debug",
    "--strip-dwarf",
    "--strip-producers",
]

[dependencies]
async-trait.workspace = true
futures.workspace = true
futures-timer.workspace = true
sha2.workspace = true
sketch-wallet-extension.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
sketch-wallet-extension = { workspace = true, features = ["export"] }
wasm-bindgen.workspace = true

[lints]
workspace = true
