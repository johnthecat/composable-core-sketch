[package]
name = "tool-codegen"
version = "0.1.0"
description = "Generates the TypeScript product client and extension point interfaces from rustdoc JSON"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tool-codegen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
heck.workspace = true
indoc.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
