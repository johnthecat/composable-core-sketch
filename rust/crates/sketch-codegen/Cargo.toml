[package]
name = "sketch-codegen"
version = "0.1.0"
description = "Generates the web side of each extension point from the interface crate's rustdoc JSON"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sketch-codegen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
indoc.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
