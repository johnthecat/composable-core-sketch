[package]
name = "sketch-core"
version = "0.1.0"
description = "The core: owns the host runtime and reaches the wallet through the Wallet extension point"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt cannot read the enabled Wasm features from a stripped binary, so they
# are listed here.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
    "--strip-debug",
    "--strip-dwarf",
    "--strip-producers",
]

[dependencies]
futures.workspace = true
sketch-wallet-extension.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
parity-scale-codec.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
async-trait.workspace = true

[lints]
workspace = true
