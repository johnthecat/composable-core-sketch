[package]
name = "host-app-web-wasm"
version = "0.1.0"
description = "The web host app's own crate: links the core and its providers into the app's one WASM binary"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# wasm-opt cannot read the enabled Wasm features from a stripped binary, so they
# are listed here.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
    "--strip-debug",
    "--strip-dwarf",
    "--strip-producers",
]

# The crate builds for wasm32 only; natively it is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
host-provider-notifier-log.workspace = true
host-provider-wallet-mock.workspace = true
host-runtime.workspace = true
product-stand-in.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
