[workspace]
resolver = "3"
members = [
	"rust/crates/*",
	"apps/host-app-web/host-app-web-wasm",
	"apps/host-app-native",
	"apps/product-native",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = "4"
futures = "0.3"
futures-timer = "3"
heck = "0.5"
indoc = "2"
js-sys = "0.3"
parity-scale-codec = { version = "3", features = ["derive"] }
proc-macro2 = "1"
quote = "1"
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
syn = "2"
thiserror = "2"
uniffi = "0.32.0"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"

host-extension = { path = "rust/crates/host-extension" }
host-macros = { path = "rust/crates/host-macros" }
host-provider-notifier-log = { path = "rust/crates/host-provider-notifier-log" }
host-provider-wallet-mock = { path = "rust/crates/host-provider-wallet-mock" }
host-runtime = { path = "rust/crates/host-runtime" }
product-native = { path = "apps/product-native" }
protocol = { path = "rust/crates/protocol" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
