[workspace]
resolver = "3"
members = ["rust/crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = "4"
futures = "0.3"
futures-timer = "3"
indoc = "2"
js-sys = "0.3"
parity-scale-codec = { version = "3", features = ["derive"] }
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4"

sketch-wallet-extension = { path = "rust/crates/sketch-wallet-extension" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
complexity = "warn"
correctness = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
